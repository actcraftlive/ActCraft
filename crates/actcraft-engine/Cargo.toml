[package]
name = "actcraft-engine"
description = "ActCraft's engine: show state, the command registry with every command, audio control and the play queue."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
actcraft-command = { workspace = true }
actcraft-show = { workspace = true }
actcraft-library = { workspace = true }
actcraft-audio = { workspace = true }
actcraft-lyrics = { workspace = true }
actcraft-notation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
craft-zip = { workspace = true }
craft-midi = { workspace = true }
craft-plist = { workspace = true }

# Lyrics from DOCX documents are read on desktops only: the reader's encryption support needs
# the browser's random numbers in a web build, which the engine has no use for.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-docx = { workspace = true }
craft-wordmodel = { workspace = true }
# The setlist PDF is written on desktops: the PDF writer, the font metrics that place its text and
# the window's own font (no font file of our own).
craft-pdf = { workspace = true, features = ["write-simple-text"] }
skrifa = "0.42"
epaint_default_fonts = "0.37"

[lints]
workspace = true
