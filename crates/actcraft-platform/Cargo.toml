[package]
name = "actcraft-platform"
description = "Desktop platform services for ActCraft: files, clock, folder-restricted access and audio output."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
actcraft-engine = { workspace = true }
actcraft-audio = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
craft-atomic = { workspace = true }
cpal = { workspace = true }
midir = { workspace = true }
rosc = { workspace = true }
artnet_protocol = { workspace = true }
sacn = { workspace = true }
gilrs = { workspace = true }
serde_json = { workspace = true }
getrandom = "0.3"
serial2 = "0.2.39"

[lints]
workspace = true

# The serial port list on Windows (already in the build through craft-i18n).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
