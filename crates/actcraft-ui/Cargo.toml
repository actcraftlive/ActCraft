[package]
name = "actcraft-ui"
description = "ActCraft's window: a thin, data-driven egui interface over engine commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
actcraft-engine = { workspace = true }
actcraft-command = { workspace = true }
actcraft-show = { workspace = true }
actcraft-library = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
craft-i18n = { workspace = true }
craft-pdf = { workspace = true }
craft-update = { workspace = true }
# The help pages are Markdown, read with the shared reader into its paragraph model.
craft-markdown = { workspace = true }
craft-flow = { workspace = true }

# Decodes the help's pictures (PNG).
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = { workspace = true }
# The window draws text in tests too; the app gets its fonts through eframe.
egui = { workspace = true, features = ["default_fonts"] }

[lints]
workspace = true
