name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Linux build dependencies of the window (winit, wgpu), the audio output (ALSA) and the
      # native file pickers (GTK through the desktop portal fallback), and libudev for game
      # controllers (gilrs).
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev libasound2-dev libudev-dev pkg-config
      # ActCraft ships on all three desktop systems, so every pull request builds and tests on each.
      os: '["ubuntu-24.04","windows-latest","macos-latest"]'
