name: Release

# Builds ActCraft for Windows, macOS and Linux and publishes a GitHub release, the way AdminCraft
# does it (the owner's other Craft app):
# - the version lives in Cargo.toml ([workspace.package]); a version with a suffix such as
#   0.1.0-alpha.2 is published as a pre-release;
# - a push to the `release` branch, or "Run workflow", builds every system with
#   `cargo xtask package` (release build, licences, attribution, readme in one archive) and
#   publishes "ActCraft vX.Y.Z" with the tag vX.Y.Z and GitHub's generated notes.
#
# Own workflow instead of craft-common-actions' release.yml (house rule 11): the shared one builds
# macOS on a larger runner a free organisation cannot get, so it leaves no release here
# (storytold/craft-common-actions#349). Back to the shared one once it can run for this repository.
# Nothing is signed.
on:
  push:
    branches: [release]
  workflow_dispatch:

# Only the publish job may write (it creates the release); everything else reads.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a version: $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ActCraft $v"
      - name: Tag must be new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION exists already: raise the version in Cargo.toml."
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build and package
        shell: bash
        run: cargo xtask package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/package/actcraft-*.zip
            target/package/actcraft-*.tar.gz
          if-no-files-found: error

  # Linux is built inside an older Ubuntu: a program links the glibc of the system it is built
  # on and refuses to start on any older one. Ubuntu 22.04 (glibc 2.35) covers Ubuntu 22.04+,
  # Debian 12+, Mint 21+ and Fedora 36+.
  build-linux:
    needs: version
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      GLIBC_MAX: "2.35"
    defaults:
      run:
        shell: bash
    steps:
      - name: Build tools and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libudev-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build and package
        run: cargo xtask package
      # Guards the comment above: fails when the program asks for a newer glibc than GLIBC_MAX.
      - name: Check the glibc it needs
        run: |
          bin="target/release/actcraft"
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n1)
          echo "needs glibc $need (allowed: $GLIBC_MAX)"
          if [ "$(printf '%s\n%s\n' "$need" "$GLIBC_MAX" | sort -V | tail -n1)" != "$GLIBC_MAX" ]; then
            echo "::error::The Linux program needs glibc $need, newer than $GLIBC_MAX."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: target/package/actcraft-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum actcraft-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pre=""
          title="ActCraft v$VERSION"
          case "$VERSION" in *-*) pre="--prerelease"; title="$title (pre-release, untested)" ;; esac
          gh release create "v$VERSION" dist/* \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$title" \
            --generate-notes $pre
