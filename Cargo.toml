[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
# cargo-fuzz targets build on nightly on their own.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/actcraftlive/ActCraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[workspace.dependencies]
actcraft-command = { path = "crates/actcraft-command" }
actcraft-show = { path = "crates/actcraft-show" }
actcraft-library = { path = "crates/actcraft-library" }
actcraft-lyrics = { path = "crates/actcraft-lyrics" }
actcraft-audio = { path = "crates/actcraft-audio" }
actcraft-engine = { path = "crates/actcraft-engine" }
actcraft-platform = { path = "crates/actcraft-platform" }
actcraft-control = { path = "crates/actcraft-control" }
actcraft-ui = { path = "crates/actcraft-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rtrb = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

# Shared Craft libraries: every craft-libs crate stays on one merged `main` rev (AGENTS.md rule 10).
craft-xtask = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
craft-jsonrpc = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
craft-mcp = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1", features = ["raster"] }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1", default-features = false, features = ["decode-native"] }

eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37"
cpal = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1

# Debug builds decode audio unoptimised: a four-minute MP3 took 42 s instead of 0.6 s, so opening
# a show seemed to hang. Dependencies (decoders, PDF rendering) and the audio crate are always
# optimised; the rest stays quick to compile and debug.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.actcraft-audio]
opt-level = 3

# craft-pdf is built against craft-libs' vendored hayro (its own [patch] doesn't reach dependents),
# so the same sources are used here, at the same craft-libs rev.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "8048f8ef92da80fb3ce5a056d59ca591ee66faf1" }
